name: Alpha stabilization and native packages
on:
  push:
    branches: [main]
    tags: ['v*-alpha.*', 'v*-rc.*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Linux native window dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libx11-dev libxkbcommon-dev libxcb1-dev libx11-xcb1 libxkbcommon-x11-0 libxrandr2 libxcursor1 libxi6 libxinerama1 libxrender1 libxfixes3 libxcb-shape0 libxcb-xfixes0 xvfb xauth xdotool
      - name: Locked source verification
        shell: bash
        run: |
          set -o pipefail
          mkdir -p dist
          git rev-parse HEAD | tee dist/source-revision.txt
          rustc -vV | tee dist/toolchain.txt
          cargo fmt --all -- --check 2>&1 | tee dist/fmt.log
          cargo clippy --workspace --all-targets --locked -- -D warnings 2>&1 | tee dist/clippy.log
          cargo test --workspace --locked 2>&1 | tee dist/tests.log
          cargo build --workspace --locked 2>&1 | tee dist/build.log
          cargo build --workspace --release --locked 2>&1 | tee dist/release-build.log
      - name: Independent-process YNS publication and discovery
        run: python tools/yns-network-demo.py --report dist/yns-network-demo.json
      - name: Testnet topology rehearsal (loopback only)
        run: python deploy/testnet/scenarios/public-e2e-rehearsal.py --report dist/public-e2e-rehearsal.json
      - name: Version verification
        shell: bash
        run: |
          version=$(cargo metadata --no-deps --locked --format-version=1 | python -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "yami-browser"))')
          echo "YAMINET_VERSION=$version" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then test "$GITHUB_REF_NAME" = "v$version"; fi
      - name: Package regression checks
        run: python -m unittest discover -s packaging -p 'test_*.py' -v
      - name: Native Linux package and virtual X11 lifecycle
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python packaging/package.py --platform linux
          python packaging/verify.py "dist/YamiNet-$YAMINET_VERSION-linux-x86_64" --expected-version "$YAMINET_VERSION"
          xvfb-run -a -s '-screen 0 1600x1000x24 -nolisten tcp' python packaging/lifecycle.py --archive "dist/YamiNet-$YAMINET_VERSION-linux-x86_64.tar.gz" --report dist/linux-lifecycle.json --gui
          xvfb-run -a -s '-screen 0 1600x1000x24 -nolisten tcp' python packaging/linux/input-smoke.py --browser "dist/YamiNet-$YAMINET_VERSION-linux-x86_64/yami-browser" --report dist/linux-input.json
      - name: Native Windows MSVC package and installer upgrade lifecycle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stage = python packaging/package.py --platform windows
          if ($LASTEXITCODE -ne 0) { throw 'Package staging failed' }
          python packaging/verify.py "$stage" --expected-version "$env:YAMINET_VERSION"
          if ($LASTEXITCODE -ne 0) { throw 'Native binary verification failed' }
          ./packaging/windows/verify-native.ps1 -Stage $stage -Version $env:YAMINET_VERSION
      - name: Upload validated packages
        uses: actions/upload-artifact@v4
        with:
          name: YamiNet-alpha-${{ runner.os }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.exe
            dist/*.sha256
          if-no-files-found: error
      - name: Preserve diagnostic evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: YamiNet-validation-${{ runner.os }}
          path: |
            dist/*.log
            dist/*.json
            dist/*.txt
            dist/*.png
          if-no-files-found: warn
