name: Alpha validation and packages
on:
  push:
    branches: [main]
    tags: ['v*-alpha.*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxkbcommon-dev libxcb1-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --locked
      - run: cargo build --workspace --release --locked
      - name: Verify tag version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: test "${GITHUB_REF_NAME}" = "v$(cargo metadata --no-deps --locked --format-version=1 | python -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "yami-browser"))')"
      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          python packaging/package.py --platform linux
          python packaging/verify.py dist/YamiNet-*-linux-x86_64
          ldd dist/YamiNet-*-linux-x86_64/yami-browser > dist/linux-dependencies.txt
          if grep -q "not found" dist/linux-dependencies.txt; then cat dist/linux-dependencies.txt; exit 1; fi
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stage = python packaging/package.py --platform windows
          python packaging/verify.py "$stage"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "C:/Program Files (x86)/NSIS/makensis.exe")) { choco install nsis --no-progress -y }
          $version = (Get-Content "$stage/VERSION.txt" -First 1).Split(' ')[1]
          & 'C:/Program Files (x86)/NSIS/makensis.exe' "/DSTAGE=$stage" "/DVERSION=$version" packaging/windows/installer.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Move-Item packaging/windows/*-setup.exe dist/
          Get-ChildItem dist/*-setup.exe | ForEach-Object {
            $hash = (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Set-Content -Encoding ascii "$($_.FullName).sha256"
          }
      - name: Package regression checks
        run: python -m unittest discover -s packaging -p 'test_*.py' -v
      - uses: actions/upload-artifact@v4
        with:
          name: YamiNet-alpha-${{ runner.os }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.exe
            dist/*.sha256
          if-no-files-found: error
