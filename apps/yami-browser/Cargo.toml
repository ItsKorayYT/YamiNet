[package]
name = "yami-browser"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
yami-config = { path = "../../crates/yami-config" }
getrandom = "0.4.3"
yami-relay = { path = "../../crates/yami-relay" }
yami-dht = { path = "../../crates/yami-dht" }
yami-node = { path = "../yami-node" }
ynp-discovery = { path = "../../crates/ynp-discovery" }
ylang = { path = "../../crates/ylang" }
ysl = { path = "../../crates/ysl" }
ynp = { path = "../../crates/ynp" }
ynp-tls = { path = "../../crates/ynp-tls" }
yami-identity = { path = "../../crates/yami-identity" }
yami-render = { path = "../../crates/yami-render", features = ["native"] }
winit = { version = "0.30", default-features = false, features = ["x11", "rwh_06"] }
softbuffer = { version = "0.4", default-features = false, features = ["x11", "x11-dlopen"] }
tiny-skia = "0.11"
arboard = { version = "3.6", default-features = false }
