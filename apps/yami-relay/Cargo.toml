[package]
name = "yami-relay-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "yami-relay"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
yami-config = { path = "../../crates/yami-config" }
ctrlc = { version = "3.5", features = ["termination"] }
yami-relay = { path = "../../crates/yami-relay" }
yami-node = { path = "../yami-node" }
yami-identity = { path = "../../crates/yami-identity" }
ynp = { path = "../../crates/ynp" }
ynp-tls = { path = "../../crates/ynp-tls" }

[dev-dependencies]
ylang = { path = "../../crates/ylang" }
