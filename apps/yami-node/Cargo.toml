[package]
name = "yami-node"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
yami-games = { path = "../../crates/yami-games" }
yami-config = { path = "../../crates/yami-config" }
yami-relay = { path = "../../crates/yami-relay" }
ctrlc = { version = "3.5", features = ["termination"] }
getrandom = "0.4.3"
yami-dht = { path = "../../crates/yami-dht" }
ynp-discovery = { path = "../../crates/ynp-discovery" }
yami-identity = { path = "../../crates/yami-identity" }
ynp = { path = "../../crates/ynp" }
ynp-tls = { path = "../../crates/ynp-tls" }

yami-render = { path = "../../crates/yami-render" }
ysl = { path = "../../crates/ysl" }

ylang = { path = "../../crates/ylang" }

[dev-dependencies]
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
