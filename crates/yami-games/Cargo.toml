[package]
name = "yami-games"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = []
native-audio = ["dep:rodio"]

[dependencies]
yami-render = { path = "../yami-render" }
tiny-skia = "0.11"
hound = "3.5"
rodio = { version = "0.20", default-features = false, optional = true }
sha2 = "0.11.1"
ynp = { path = "../ynp" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasmi = { version = "=2.0.0", default-features = false, features = ["stable", "std", "validate", "portable-dispatch"] }

[dev-dependencies]
wat = "1"
