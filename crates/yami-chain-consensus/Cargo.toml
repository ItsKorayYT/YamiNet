[package]
name = "yami-chain-consensus"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
yami-chain = { path = "../yami-chain" }
yami-chain-storage = { path = "../yami-chain-storage" }
malachite = { package = "arc-malachitebft-app-channel", version = "=0.8.2" }
malachite-core = { package = "arc-malachitebft-core-consensus", version = "=0.8.2" }
malachite-signing = { package = "arc-malachitebft-signing", version = "=0.8.2" }
malachite-sync = { package = "arc-malachitebft-sync", version = "=0.8.2" }
libp2p-identity = { version = "0.2.14", default-features = false, features = ["ed25519", "peerid"] }
async-trait = "0.1"
bytes = "1"
bytesize = "2"
eyre = "0.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "net"] }

[features]
fuzzing = []
large-state-lab = ["yami-chain/experimental-snapshot-v2"]

[[example]]
name = "fuzz-seeds"
required-features = ["fuzzing"]

[[example]]
name = "large-state-bench"
required-features = ["large-state-lab"]
