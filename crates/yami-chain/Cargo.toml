[package]
name = "yami-chain"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = []
experimental-snapshot-v2 = []

[dependencies]
im = "15.1.0"
sha2 = "0.11.1"
ed25519-dalek = "3.0.0"
yami-chain-naming = { path = "../yami-chain-naming" }
yami-chain-privacy = { path = "../yami-chain-privacy" }

[[bench]]
name = "execution"
harness = false

[[example]]
name = "snapshot-v2-bench"
required-features = ["experimental-snapshot-v2"]
