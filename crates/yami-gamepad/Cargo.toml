[package]
name = "yami-gamepad"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "GPL-3.0-only"
description = "Bounded native gamepad polling for Yami Browser games"

[dependencies]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_Input_XboxController"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"
