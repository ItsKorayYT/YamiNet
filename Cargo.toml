[workspace]
members = ["crates/ylang", "crates/ysl", "crates/ynp", "crates/yami-render", "apps/yami-browser", "apps/yami-node"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "GPL-3.0-only"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
