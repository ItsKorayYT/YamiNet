[package]
name = "yamichain-privacy-lab"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "GPL-3.0-only"
publish = false

# Deliberately separate from the chain workspace and its dependency closure.
[workspace]

[dependencies]
monero-wallet = { git = "https://github.com/monero-oxide/monero-oxide", rev = "a6b46701fb9b331006d7f2f2278bf51f123b1447" }
curve25519-dalek = "=4.1.3"
rand_core = { version = "=0.6.4", features = ["getrandom"] }
zeroize = { version = "=1.8.2", features = ["derive"] }
sha2 = "=0.10.9"
hkdf = "=0.12.4"
age = { version = "=0.11.1", default-features = false }

[dev-dependencies]
yami-chain = { path = "../../crates/yami-chain" }

[lints.rust]
unsafe_code = "forbid"

[profile.release]
overflow-checks = true

[profile.dev.package.curve25519-dalek]
opt-level = 3
