[package]
name = "yamichain-tee-m20"
version = "0.1.0"
edition = "2021"
publish = false
[workspace]
[dependencies]
chacha20poly1305 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fs2 = "0.4"
[dev-dependencies]
tempfile = "3"
[profile.release]
overflow-checks = true
