[package]
name = "yamichain-tee-m20"
version = "0.1.0"
edition = "2021"
publish = false
[workspace]
[dependencies]
yami-chain = { path = "../../crates/yami-chain", features=["insecure-devnet-input"] }
yami-chain-storage = { path = "../../crates/yami-chain-storage" }
yami-chain-consensus = { path = "../../crates/yami-chain-consensus" }
chacha20poly1305 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fs2 = "0.4"
rusqlite = { version = "0.37", features = ["bundled"] }
socket2 = "0.6"
libloading = "0.8"
libc = "0.2"
openssl = "0.10"
hex = "0.4"
time = { version = "=0.3.44", features = ["parsing"] }
[dev-dependencies]
tempfile = "3"
[profile.release]
overflow-checks = true

[features]
tdx-guest-devnet = []
[[bin]]
name = "tdx-executor"
path = "src/bin/tdx-executor.rs"
required-features = ["tdx-guest-devnet"]
[[bin]]
name = "tdx-admin"
path = "src/bin/tdx-admin.rs"
required-features = ["tdx-guest-devnet"]
