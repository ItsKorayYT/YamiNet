[package]
name = "yamichain-validator-lab"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "GPL-3.0-only"
publish = false

[workspace]

[dependencies]
yami-chain = { path = "../../crates/yami-chain" }
yami-chain-storage = { path = "../../crates/yami-chain-storage" }
yami-chain-consensus = { path = "../../crates/yami-chain-consensus" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.4"
eyre = "0.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "io-util", "sync", "signal"] }

[lints.rust]
unsafe_code = "forbid"

[profile.release]
overflow-checks = true
