[package]
name = "yamichain-ypp-accounts"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false
[workspace]
[dependencies]
ark-bls12-381 = "=0.5.0"
ark-ff = "=0.5.0"
ark-ec = "=0.5.0"
ark-ed-on-bls12-381 = { version = "=0.5.0", features = ["r1cs"] }
ark-groth16 = "=0.5.0"
ark-relations = "=0.5.1"
ark-r1cs-std = "=0.5.0"
ark-serialize = "=0.5.0"
rand = "=0.8.5"
sha2 = "=0.10.9"
serde_json = "1"
[dev-dependencies]
yami-chain-privacy = { path = "../../crates/yami-chain-privacy" }
[profile.release]
overflow-checks = true
[lints.rust]
unsafe_code = "forbid"
